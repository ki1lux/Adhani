org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
# Jetifier rewrites legacy support-library bytecode. Every dependency in this
# project is already AndroidX, so this only cost build time.
android.enableJetifier=false

# R8 full mode: stronger shrinking and optimisation than compatibility mode.
# The keep rules in proguard-rules.pro are written for it.
android.enableR8.fullMode=true

# Strip unused native ABIs and resources from the release bundle.
android.nonTransitiveRClass=true
