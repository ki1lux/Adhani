# Static analysis configuration.
#
# The recommended Flutter lint set was commented out, so `flutter analyze`
# reported "No issues found!" on a codebase with unawaited futures, BuildContext
# used across async gaps, and `print` calls shipping to release. It is enabled
# now, and the app is clean against it.
include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # `print` in production code ships to logcat on a user's device. Use
    # logDebug/logWarning from lib/services/app_logger.dart instead.
    avoid_print: error
    # Using a BuildContext after an await is the single most common source of
    # "setState() called after dispose()" crashes in this codebase's shape.
    use_build_context_synchronously: error
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    # File names in lib/view and lib/controller are UpperCamelCase, which
    # predates this config and would be a large, purely cosmetic rename.
    file_names: false
    # The codebase deliberately keeps `new`-less constructors non-const in
    # places where a later edit is expected; the analyzer's suggestions here
    # are noise rather than signal.
    prefer_const_constructors: false
    prefer_const_literals_to_create_immutables: false
